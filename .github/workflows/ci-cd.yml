name: CI/CD Pipeline - Robot Shop & Observability

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-validate:
    name: Lint & Validate Manifests / Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Application Helm Chart
        run: |
          helm lint K8s/helm/

      - name: Lint Observability Helm Values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm template test-release prometheus-community/kube-prometheus-stack \
            -f observability/helm-values/prometheus-values.yaml \
            --kube-version 1.28.0 \
            --dry-run > /dev/null

      - name: Install and Run Kubeconform Natively
        run: |
          WGET_URL="https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform_linux_amd64.tar.gz"
          wget -O kubeconform.tar.gz $WGET_URL
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -summary observability/ || true